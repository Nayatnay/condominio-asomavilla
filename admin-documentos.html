<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Documentos | Admin Asomavilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <main>
        <header>
            <div class="welcome-box">
                <h1>Gestión de Documentos Oficiales</h1>
                <p>Publica actas, normativas y comunicados para que los residentes puedan consultarlos.</p>
            </div>
            <div class="badge-status admin-badge-status">
                Modo Administrador
            </div>
        </header>

        <!-- Formulario para Publicar Nuevo Documento -->
        <div class="card admin-doc-form-card">
            <h3 class="admin-doc-form-title">Publicar Nuevo Documento</h3>
            <form id="formNuevoDocumento" class="admin-doc-grid-form">
                <div class="form-group">
                    <label class="form-label">Título del Documento</label>
                    <input type="text" id="docTitulo" placeholder="Ej. Reglamento Interno 2026" required class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Categoría</label>
                    <select id="docCategoria" class="form-select">
                        <option value="Reglamento">Reglamento</option>
                        <option value="Acta">Acta de Asamblea</option>
                        <option value="Comunicado">Comunicado Oficial</option>
                        <option value="Finanzas">Informe Financiero</option>
                        <option value="General">General</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label class="form-label">Descripción Breve</label>
                    <input type="text" id="docDescripcion" placeholder="Ej. Normativa aprobada en la última asamblea de copropietarios." required class="form-input">
                </div>
                <div class="form-group full-width">
                    <label class="form-label">Enlace del Archivo (URL de PDF / Google Drive / Firebase)</label>
                    <input type="url" id="docUrl" placeholder="https://ejemplo.com/archivo.pdf" required class="form-input">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary-full">
                        Publicar Documento
                    </button>
                </div>
            </form>
        </div>

        <div class="section-header-bar">
            <h3 class="section-title">Documentos Publicados Actualmente</h3>
        </div>

        <!-- Contenedor de la lista de documentos publicados -->
        <div id="adminDocumentosList" class="admin-docs-container">
            <p class="loading-text">Cargando documentos...</p>
        </div>
    </main>

    <script type="module" src="admin-documentos.js"></script>
</body>

</html>
