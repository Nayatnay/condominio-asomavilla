<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cuotas | Admin Asomavilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <main>
        <header>
            <div class="welcome-box">
                <h1>Gestión de Cuotas y Cobros</h1>
                <p>Emite cuotas de mantenimiento y revisa los cargos asignados a los inmuebles.</p>
            </div>
            <div class="badge-status admin-badge-status">
                Modo Administrador
            </div>
        </header>

        <!-- Formulario para Registrar / Generar Cuota -->
        <div class="card cuota-form-card">
            <h3 class="cuota-form-title">Emitir Nueva Cuota</h3>
            <form id="formNuevaCuota" class="cuota-grid-form">
                <div class="form-group">
                    <label class="form-label">Concepto de la Cuota</label>
                    <input type="text" id="cuotaConcepto" placeholder="Ej. Mantenimiento Agosto 2026" required class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Monto ($)</label>
                    <input type="number" step="0.01" id="cuotaMonto" placeholder="Ej. 30.00" required class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Período / Mes</label>
                    <input type="month" id="cuotaMes" required class="form-input" value="2026-08">
                </div>
                <div class="form-group">
                    <label class="form-label">Destinatario</label>
                    <select id="cuotaDestino" class="form-select">
                        <option value="todas">Todas las casas (General)</option>
                    </select>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary-full">Emitir Cuota</button>
                </div>
            </form>
        </div>

        <div class="section-header-bar">
            <h3 class="section-title">Historial de Cuotas Emitidas</h3>
        </div>

        <!-- Filtros y botón de borrado masivo -->
        <div class="filter-actions-bar">
            <input type="text" id="filtroTexto" placeholder="Filtrar por casa, concepto o mes..." class="filter-input">
            <button id="btnEliminarFiltrados" class="btn btn-danger-subtle">Eliminar filtrados visibles</button>
        </div>

        <!-- Contenedor del listado de cuotas -->
        <div id="cuotasList" class="cuotas-container">
            <p class="loading-text">Cargando cuotas...</p>
        </div>
        
    </main>

    <script type="module" src="admin-cuotas.js"></script>
</body>

</html>
