<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cuotas | Admin Asomavilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <main>
        <header>
            <div class="welcome-box">
                <h1>Gestión de Cuotas y Cobros</h1>
                <p>Emite cuotas de mantenimiento desglosadas y revisa los cargos asignados a los inmuebles.</p>
            </div>
            <div class="badge-status admin-badge-status">
                Modo Administrador
            </div>
        </header>

        <!-- Formulario para Registrar / Generar Cuota Desglosada -->
        <div class="card cuota-form-card">
            <h3 class="cuota-form-title">Emitir Nueva Cuota Desglosada</h3>
            <form id="formNuevaCuota" class="cuota-grid-form">
                
                <!-- Datos Generales -->
                <div class="form-group">
                    <label class="form-label">Concepto General</label>
                    <input type="text" id="cuotaConcepto" placeholder="Ej. Mantenimiento Mes" required class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Período / Mes</label>
                    <input type="month" id="cuotaMes" required class="form-input" value="2026-08">
                </div>
                <div class="form-group">
                    <label class="form-label">Destinatario</label>
                    <select id="cuotaDestino" class="form-select">
                        <option value="todas">Todas las casas (General)</option>
                    </select>
                </div>

                <!-- Sección de Desglose de Gastos -->
                <div class="form-group full-width" style="border-top: 1px solid #e2e8f0; padding-top: 1rem; margin-top: 0.5rem;">
                    <label class="form-label" style="font-size: 0.95rem; color: #0284c7; margin-bottom: 0.5rem;">Desglose de Gastos (Relación de Gastos)</label>
                    
                    <div id="gastosContainer" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.8rem;">
                        <!-- Aquí se inyectarán las filas de gastos dinámicamente -->
                    </div>

                    <button type="button" id="btnAddGasto" class="btn" style="background: #f1f5f9; color: #0f172a; border: 1px dashed #cbd5e1; font-size: 0.85rem; padding: 0.4rem 0.8rem; cursor: pointer;">
                        + Agregar Ítem de Gasto
                    </button>
                </div>

                <!-- Resumen de Monto y Botón Final -->
                <div class="form-group full-width" style="display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 1rem; border-radius: 6px; border: 1px solid #e2e8f0;">
                    <div>
                        <span style="font-size: 0.85rem; color: var(--text-muted, #666);">Monto Total Calculado:</span>
                        <h3 id="lblMontoTotal" style="margin: 0; color: var(--text-main, #222);">$0.00</h3>
                        <input type="hidden" id="cuotaMonto" required>
                    </div>
                    <button type="submit" class="btn btn-primary-full" style="width: auto; padding: 0.6rem 1.5rem;">Emitir Cuota</button>
                </div>

            </form>
        </div>

        <div class="section-header-bar">
            <h3 class="section-title">Historial de Cuotas Emitidas</h3>
        </div>

        <!-- Filtros y botón de borrado masivo -->
        <div class="filter-actions-bar">
            <input type="text" id="filtroTexto" placeholder="Filtrar por casa, concepto o mes..." class="filter-input">
            <button id="btnEliminarFiltrados" class="btn btn-danger-subtle">Eliminar filtrados visibles</button>
        </div>

        <!-- Contenedor del listado de cuotas -->
        <div id="cuotasList" class="cuotas-container">
            <p class="loading-text">Cargando cuotas...</p>
        </div>
        
    </main>

    <script type="module" src="admin-cuotas.js"></script>
</body>

</html>
