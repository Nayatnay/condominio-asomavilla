<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | Asomavilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <!-- Contenido Principal -->
    <main>
        <header>
            <div class="welcome-box">
                <h1>Áreas Comunes</h1>
                <p>Consulta tus reservas agendadas o aparta un espacio para tu próximo evento.</p>
            </div>
            <div class="badge-status" id="userBadge">
                Cargando...
            </div>
        </header>

        <!-- Barra de Acciones -->
        <div class="actions-bar">
            <h3 class="section-title">Mis Reservas</h3>
            <a href="nueva-reserva.html" class="btn">+ Nueva Reserva</a>
        </div>

        <!-- Contenedor donde se cargarán dinámicamente las reservas -->
        <div id="reservasList" class="reservas-container">
            <p class="loading-text">Cargando tus reservas...</p>
        </div>
    </main>

    <script type="module" src="reservas-list.js"></script>
</body>

</html>
