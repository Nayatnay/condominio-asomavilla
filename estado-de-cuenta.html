<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Cuenta | Asomavilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <!-- Contenido Principal -->
    <main>
        <header>
            <div class="welcome-box">
                <h1>Estado de Cuenta</h1>
                <p>Consulta tus cuotas de condominio, saldo deudor y el historial de pagos registrados.</p>
            </div>
            <div class="badge-status" id="userBadge">
                Cargando...
            </div>
        </header>

        <!-- Tarjeta de Resumen Financiero -->
        <section class="card financial-summary-card">
            <div>
                <span class="financial-label">Saldo Actual a Pagar</span>
                <h2 id="saldoTotal" class="financial-saldo">
                    Cargando...</h2>
            </div>
            <a href="reportar-pago.html" class="btn">+ Reportar Pago</a>
        </section>

        <!-- Contenedor del Título y el Botón -->
        <div class="actions-bar">
            <h3 class="section-title">Historial de cuotas y pagos</h3>
            <button id="btnDescargarPDF" class="btn btn-pdf">
                📥 Descargar PDF
            </button>
        </div>

        <!-- Debajo, tu contenedor de movimientos -->
        <div id="movimientosList" class="movimientos-container">
            <!-- Los movimientos se cargarán aquí -->
        </div>
    </main>

    <!-- Librerías para generar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script type="module" src="estado-de-cuenta.js"></script>
</body>

</html>
