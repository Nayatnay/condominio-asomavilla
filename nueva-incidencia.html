<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Incidencia | Asomavilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <!-- Menú Lateral -->
    <aside>
        <div>
            <div class="logo-area">
                <h2>Asomavilla</h2>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html">Inicio</a></li>
                <li><a href="#">Estado de Cuenta</a></li>
                <li><a href="#">Reservas</a></li>
                <li><a href="incidencias.html" class="active">Incidencias</a></li>
                <li><a href="#">Documentos</a></li>
                <li><a href="#" id="logoutBtn" style="color: #f87171; margin-top: 2rem; cursor: pointer;">Cerrar Sesión</a></li>
            </ul>
        </div>
        <div class="user-profile">
            Bienvenido,<br>
            <span>Cargando...</span>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main>
        <header>
            <div class="welcome-box">
                <h1>Reportar Incidencia</h1>
                <p>Notifica cualquier anomalía en las áreas comunes para su pronta atención.</p>
            </div>
            <div class="badge-status" id="userBadge">
                Cargando...
            </div>
        </header>

        <!-- Formulario de Incidencia -->
        <section class="card incident-card-container">
            <form id="incidentForm" class="incident-form">
                <div class="form-group">
                    <label for="tipo">Categoría del Problema</label>
                    <select id="tipo" name="tipo" required>
                        <option value="" disabled selected>Selecciona una categoría...</option>
                        <option value="iluminacion">Iluminación / Electricidad</option>
                        <option value="porton">Portón / Acceso Vehicular</option>
                        <option value="hidro">Bombas de Agua / Hidroneumático</option>
                        <option value="limpieza">Áreas Verdes / Aseo</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ubicacion">Ubicación exacta</label>
                    <input type="text" id="ubicacion" name="ubicacion" placeholder="Ej: Sótano 1, cerca del puesto 45" required>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción detallada</label>
                    <textarea id="descripcion" name="descripcion" rows="4" placeholder="Describe brevemente qué ocurre..." required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Enviar Reporte</button>
                    <a href="incidencias.html" class="link-cancel">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <!-- Este archivo sigue siendo el que procesa el envío -->
    <script type="module" src="incidencias.js"></script>
</body>

</html>
