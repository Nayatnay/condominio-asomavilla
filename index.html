<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | ASOMAVILLA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <h2>Asomavilla</h2>
            <p>Ingresa a tu cuenta para gestionar tu condominio</p>
        </div>

        <!-- Formulario de Acceso -->
        <form action="dashboard.html" method="GET">
            <div class="form-group">
                <label for="email">Correo electrónico o Usuario</label>
                <input type="text" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-block">Iniciar Sesión</button>
        </form>

        <div class="login-footer">
            <a href="#" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
            <br>
            <a href="contacto.html" class="contact-link">Contacto para nuevos residentes</a>
        </div>
    </div>
    <script type="module" src="auth.js"></script>
</body>
</html>
