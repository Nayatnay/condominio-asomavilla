<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Residentes | Admin Asomavilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <main>
        <header>
            <div class="welcome-box">
                <h1>Control de Residentes y Solvencia</h1>
                <p>Actualiza el estatus de pago de los propietarios y registra nuevos accesos al sistema.</p>
            </div>
            <div class="badge-status admin-badge-status">
                Modo Administrador
            </div>
        </header>

        <!-- Formulario para Registrar Nuevo Usuario -->
        <div class="card admin-res-form-card">
            <h3 class="admin-res-form-title">Registrar Nuevo Usuario / Residente</h3>
            <form id="formNuevoResidente" class="admin-res-grid-form">
                <div class="form-group">
                    <label class="form-label">Nombre y Apellido</label>
                    <input type="text" id="nuevoNombre" required class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Número de Casa</label>
                    <input type="text" id="nuevaCasa" placeholder="Ej. Casa 12" required class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="nuevoEmail" placeholder="correo@ejemplo.com" required class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña Inicial</label>
                    <input type="password" id="nuevoPassword" placeholder="Mínimo 6 caracteres" required class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Rol en el Sistema</label>
                    <select id="nuevoRol" class="form-select">
                        <option value="residente">Residente</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary-full">Crear Acceso</button>
                </div>
            </form>
        </div>

        <div class="section-header-bar">
            <h3 class="section-title">Lista de Propietarios</h3>
        </div>

        <!-- Filtro de Morosos -->
        <div class="card filter-morosos-card">
            <div>
                <label class="filter-label">Filtrar residentes:</label>
                <select id="filtroEstado" class="filter-select">
                    <option value="todos">Todos los residentes</option>
                    <option value="morosos">Solo Morosos (Pendientes)</option>
                </select>
            </div>
            <button id="btnPrintMorosos" class="btn btn-morosos-print">
                📄 Listado de morosos
            </button>
        </div>

        <!-- Contenedor de la tabla / lista de usuarios -->
        <div id="residentesList" class="residentes-container">
            <p class="loading-text">Cargando residentes...</p>
        </div>
    </main>

    <!-- Modal para Editar Residente -->
    <div id="editModal" class="modal-overlay">
        <div class="card modal-card">
            <h3 class="modal-title">Editar Residente</h3>
            <form id="formEditarResidente" class="modal-form">
                <input type="hidden" id="editUserId">
                <div class="form-group">
                    <label class="form-label">Nombre y Apellido</label>
                    <input type="text" id="editNombre" required class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Número de Casa</label>
                    <input type="text" id="editCasa" required class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Correo Electrónico (Solo lectura)</label>
                    <input type="text" id="editEmailDisplay" readonly class="form-input readonly-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Rol / Estatus de Acceso</label>
                    <select id="editRol" class="form-select">
                        <option value="residente">Residente</option>
                        <option value="admin">Administrador</option>
                        <option value="inactivo">Inactivo / Suspendido</option>
                    </select>
                </div>
                <button type="button" id="btnResetPassword" class="btn btn-warning-full">
                    Enviar Correo de Recuperación de Clave
                </button>

                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary flex-1">Guardar Cambios</button>
                    <button type="button" id="cerrarModalBtn" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="admin-residentes.js"></script>
</body>

</html>
