<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Comunicados | Admin Asomavilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <main>
        <header>
            <div class="welcome-box">
                <h1>Publicar Comunicado</h1>
                <p>Envía un aviso oficial que aparecerá de inmediato en el inicio de todos los residentes.</p>
            </div>
            <div class="badge-status admin-badge-status">
                Modo Administrador
            </div>
        </header>

        <!-- Formulario para nuevo comunicado -->
        <div class="card admin-form-card">
            <form id="formComunicado" class="admin-form">
                <div class="form-group">
                    <label class="form-label">Título del Comunicado</label>
                    <input type="text" id="tituloComm" required placeholder="Ej. Corte de agua programado" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Mensaje</label>
                    <textarea id="mensajeComm" rows="4" required placeholder="Escribe los detalles del aviso aquí..." class="form-textarea"></textarea>
                </div>
                <button type="submit" class="btn btn-primary-full">Publicar Comunicado</button>
            </form>
        </div>

        <!-- Lista de comunicados existentes para eliminar -->
        <div class="admin-list-section">
            <h3 class="section-title admin-list-title">Comunicados Activos</h3>
            <div id="adminComunicadosList" class="admin-comunicados-container">
                <p class="loading-text">Cargando comunicados...</p>
            </div>
        </div>
    </main>

    <script type="module" src="admin-comunicados.js"></script>
</body>

</html>
