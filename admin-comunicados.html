<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Comunicados | Admin Asomavilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <main>
        <header>
            <div class="welcome-box">
                <h1>Publicar Comunicado</h1>
                <p>Envía un aviso oficial que aparecerá de inmediato en el inicio de todos los residentes.</p>
            </div>
            <div class="badge-status" style="background-color: #fee2e2; color: #991b1b;">
                Modo Administrador
            </div>
        </header>

        <!-- Formulario para nuevo comunicado -->
        <div class="card" style="max-width: 600px; margin-top: 1.5rem;">
            <form id="formComunicado" style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem;">Título del Comunicado</label>
                    <input type="text" id="tituloComm" required placeholder="Ej. Corte de agua programado" style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem;">Mensaje</label>
                    <textarea id="mensajeComm" rows="4" required placeholder="Escribe los detalles del aviso aquí..." style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;"></textarea>
                </div>
                <button type="submit" class="btn" style="background-color: #0284c7; color: white; padding: 0.75rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Publicar Comunicado</button>
            </form>
        </div>
        <!-- Lista de comunicados existentes para eliminar -->
        <div style="margin-top: 2.5rem;">
            <h3 class="section-title" style="margin-bottom: 1rem;">Comunicados Activos</h3>
            <div id="adminComunicadosList" style="display: flex; flex-direction: column; gap: 1rem; max-width: 800px;">
                <p style="color: var(--text-muted, #666);">Cargando comunicados...</p>
            </div>
        </div>
    </main>

    <script type="module" src="admin-comunicados.js"></script>
</body>

</html>
