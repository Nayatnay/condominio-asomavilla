<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Pagos | Admin Asomavilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <main>
        <header>
            <div class="welcome-box">
                <h1>Validación de Pagos y Transferencias</h1>
                <p>Revisa las referencias bancarias reportadas por los propietarios y aprueba o rechaza los movimientos.</p>
            </div>
            <div class="badge-status" style="background-color: #fee2e2; color: #991b1b;">
                Modo Administrador
            </div>
        </header>

        <div style="margin: 1.5rem 0 1rem 0;">
            <h3 class="section-title" style="margin: 0;">Pagos Pendientes de Verificación</h3>
        </div>

        <!-- Contenedor donde se cargarán los pagos reportados -->
        <div id="adminPagosList" style="display: flex; flex-direction: column; gap: 1rem;">
            <p style="color: var(--text-muted, #666);">Cargando pagos reportados...</p>
        </div>
    </main>

    <script type="module" src="admin-pagos.js"></script>
</body>

</html>
